services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: >-
      sh -c "python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /var/lib/ambiental/media:/var/lib/siga/media
      - /var/www/ambiental/static:/var/www/siga/staticfiles
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - /var/lib/ambiental/media:/var/lib/siga/media
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build: .
    restart: unless-stopped
    command: >-
      celery -A config beat -l info
      --schedule=/var/lib/siga/celerybeat/schedule
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - celerybeat_data:/var/lib/siga/celerybeat
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  celerybeat_data:
