server {
    listen 80;
    listen [::]:80;
    server_name siga.seudominio.com.br;

    client_max_body_size 25M;

    location /static/ {
        alias /var/www/siga/staticfiles/;
        access_log off;
        expires 7d;
    }

    # Os documentos em /media/ nao sao publicados diretamente. O Django
    # continua verificando as permissoes antes de permitir visualizacao.
    location / {
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/siga/gunicorn.sock;
    }
}
