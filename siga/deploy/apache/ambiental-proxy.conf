# Inserir dentro do VirtualHost existente do portal, tanto no :80 quanto no :443.
# O DocumentRoot /var/www e as demais configuracoes do portal permanecem iguais.

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
RequestHeader set X-Forwarded-Prefix "/ambiental"

Alias /ambiental/static/ /var/www/ambiental/static/
<Directory /var/www/ambiental/static>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

ProxyPass /ambiental/static/ !
ProxyPass        /ambiental/ http://127.0.0.1:8000/
ProxyPassReverse /ambiental/ http://127.0.0.1:8000/
